<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-deep: #05060d;
    --bg-panel: #0e1120;
    --border: rgba(167, 139, 250, 0.18);
    --accent-purple: #a78bfa;
    --accent-cyan: #2dd4bf;
    --accent-orange: #f5a962;
    --text-primary: #edeef7;
    --text-muted: #868ba8;
  }

  body {
    font-family: system-ui, sans-serif;
    width: 280px;
    margin: 0;
    padding: 16px;
    background: radial-gradient(120% 100% at 100% 0%, #1a1440 0%, var(--bg-deep) 55%);
    color: var(--text-primary);
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 0 24px rgba(167, 139, 250, 0.08);
  }

  .accent-bar {
    height: 3px;
    border-radius: 2px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan) 55%, var(--accent-orange));
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 14px;
    margin: 0;
    color: var(--text-primary);
    letter-spacing: 0.2px;
  }

  .subtitle {
    font-size: 10px;
    margin: 2px 0 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .icon-btn {
    background: none;
    border: none;
    padding: 4px;
    display: flex;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .icon-btn:hover {
    background: rgba(167, 139, 250, 0.15);
  }
  .icon-btn svg {
    width: 16px;
    height: 16px;
    fill: var(--text-muted);
    transition: fill 0.15s ease;
  }
  .icon-btn:hover svg {
    fill: var(--accent-purple);
  }

  .features {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .feature-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .feature-label {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .feature-label label {
    font-size: 12px;
    color: var(--text-primary);
    cursor: pointer;
    line-height: 1.3;
  }

  .info-btn {
    background: none;
    border: none;
    padding: 2px;
    display: flex;
    flex-shrink: 0;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .info-btn:hover {
    background: rgba(45, 212, 191, 0.18);
  }
  .info-btn svg {
    width: 13px;
    height: 13px;
    fill: var(--text-muted);
    transition: fill 0.15s ease;
  }
  .info-btn:hover svg {
    fill: var(--accent-cyan);
  }

  .switch {
    position: relative;
    width: 34px;
    height: 19px;
    flex-shrink: 0;
    display: block;
    cursor: pointer;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    left: 2px;
    top: 2px;
    background: var(--text-primary);
    border-radius: 50%;
    transition: transform 0.2s ease;
  }
  .switch input:checked + .slider {
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
    box-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
    border-color: transparent;
  }
  .switch input:checked + .slider::before {
    transform: translateX(15px);
  }

  .section-caption {
    font-size: 9.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 4px 0 -2px;
  }

  p.hint {
    font-size: 10.5px;
    color: var(--text-muted);
    margin: 12px 0 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div>
        <h1>ChomePlus</h1>
        <p class="subtitle">Nag Prompt Blocker</p>
      </div>
      <button id="settings" class="icon-btn" title="Extension details" aria-label="Extension details">
        <svg viewBox="0 0 24 24">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </button>
    </div>
    <div class="accent-bar"></div>
    <div id="features" class="features"></div>
    <p class="hint">Reload open tabs after changing a setting for it to fully take effect.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
